name: Import website package
on:
  push:
    paths:
      - '.github/workflows/import.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download import-1 --pattern 'newyorkcity.zip'
      - name: Verify checksum
        run: echo "f98d9c03af43879bf85bb4a0b3e4db1cd677d0cd72c389f6c90c8fd952817b17  newyorkcity.zip" | sha256sum -c -
      - name: Replace contents
        run: |
          mkdir -p /tmp/pkg && unzip -o newyorkcity.zip -d /tmp/pkg
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/pkg/. .
          rm -rf .github newyorkcity.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import website package"
          git push
